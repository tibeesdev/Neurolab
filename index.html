      showToast
    }) {
      const [authenticated, setAuthenticated] = useState(false);
      const [password, setPassword] = useState("");
      const [adminTab, setAdminTab] = useState("stats");

      const [qForm, setQForm] = useState({ category: "Brain Health", difficulty: "Mudah", question: "", opt0: "", opt1: "", opt2: "", explanation: "" });
      const [aForm, setAForm] = useState({ title: "", category: "Brain Health", summary: "", content: "", funFact: "", healthTips: "", reference: "Kemenkes RI" });
      const [advForm, setAdvForm] = useState({ color: "red", title: "", body: "", points: 40 });
      const [caseForm, setCaseForm] = useState({ name: "", age: 50, gender: "Laki-laki", complaint: "", history: "" });

      if (!authenticated) {
        return (
          <div className="max-w-md mx-auto bg-white rounded-[2rem] p-8 border-2 border-slate-200 shadow-lg space-y-5 text-center">
            <div className="w-16 h-16 rounded-3xl bg-slate-800 text-white flex items-center justify-center mx-auto">
              <Icon name="Lock" className="w-8 h-8" />
            </div>
            <h1 className="text-2xl font-black text-slate-900">Dashboard Administrator</h1>
            <p className="text-sm text-slate-600">
              Kelola soal kuis, artikel BrainPedia, kasus LabSimulation, dan kartu BrainAdventure.
            </p>
            <div className="bg-amber-50 border border-amber-300 rounded-xl p-2.5 text-xs font-bold text-amber-900">
              PIN Akses Admin: <code className="bg-white px-1.5 py-0.5 rounded border">admin123</code>
            </div>
            <input
              type="password"
              placeholder="Masukkan kata sandi..."
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              className="w-full p-3.5 rounded-2xl border-2 border-slate-200 text-center font-black"
            />
            <button
              type="button"
              onClick={() => {
                if (password === "admin123") {
                  setAuthenticated(true);
                  showToast("Akses Admin Dibuka", "Perubahan konten akan tersimpan ke Cloud.");
                } else {
                  playErrorBuzz();
                  showToast("Kata Sandi Salah", "Silakan masukkan admin123.", "warning");
                }
              }}
              className="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-black"
            >
              Masuk Dashboard Admin
            </button>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 text-white rounded-[2rem] p-6 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span className="text-xs font-black text-amber-400 uppercase">Content Management System</span>
              <h1 className="text-2xl font-black">Dashboard Administrator BAKTI SmartDoll</h1>
              <p className="text-xs text-slate-300 mt-0.5">Setiap konten baru langsung tersimpan dan muncul otomatis bagi seluruh pengguna.</p>
            </div>
            <button type="button" onClick={() => setAuthenticated(false)} className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-extrabold">
              Kunci Sesi Admin
            </button>
          </div>

          <div className="flex gap-2 overflow-x-auto pb-1">
            {[
              { id: "stats", label: "📊 Statistik & Pengguna" },
              { id: "quiz", label: `🧠 Kuis (${quizQuestions.length})` },
              { id: "articles", label: `📚 BrainPedia (${articles.length})` },
              { id: "cases", label: `🧪 Kasus Lab (${labCases.length})` },
              { id: "adventure", label: "🎲 Kartu BrainAdventure" }
            ].map((t) => (
              <button
                key={t.id}
                type="button"
                onClick={() => setAdminTab(t.id)}
                className={`px-4 py-2.5 rounded-2xl text-xs font-black whitespace-nowrap ${
                  adminTab === t.id ? "bg-blue-600 text-white shadow" : "bg-white border border-slate-200 text-slate-700"
                }`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {adminTab === "stats" && (
            <div className="bg-white rounded-[2rem] p-6 border border-slate-200 space-y-4">
              <h2 className="text-xl font-black text-slate-900">Statistik Konten &amp; Pengguna Global</h2>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div className="p-4 rounded-2xl bg-blue-50 border border-blue-200">
                  <p className="text-xs font-bold text-blue-700">Total Akun Email</p>
                  <p className="text-2xl font-black text-blue-900">{globalLeaderboard.length} Akun</p>
                </div>
                <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                  <p className="text-xs font-bold text-emerald-700">Kasus Simulasi Lab</p>
                  <p className="text-2xl font-black text-emerald-900">{labCases.length} Kasus</p>
                </div>
                <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200">
                  <p className="text-xs font-bold text-amber-700">Bank Soal BrainQuiz</p>
                  <p className="text-2xl font-black text-amber-900">{quizQuestions.length} Soal</p>
                </div>
                <div className="p-4 rounded-2xl bg-rose-50 border border-rose-200">
                  <p className="text-xs font-bold text-rose-700">Artikel Edukasi</p>
                  <p className="text-2xl font-black text-rose-900">{articles.length} Artikel</p>
                </div>
              </div>
            </div>
          )}

          {adminTab === "quiz" && (
            <div className="bg-white rounded-[2rem] p-6 border border-slate-200 space-y-5">
              <h2 className="text-xl font-black text-slate-900">Kelola Pertanyaan BrainQuiz</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl">
                <select value={qForm.category} onChange={(e) => setQForm({ ...qForm, category: e.target.value })} className="p-2.5 rounded-xl border font-bold">
                  {["Brain Health", "Heart Health", "Blood Circulation", "Laboratory Knowledge", "Stroke Awareness", "Healthy Lifestyle"].map((c) => <option key={c}>{c}</option>)}
                </select>
                <select value={qForm.difficulty} onChange={(e) => setQForm({ ...qForm, difficulty: e.target.value })} className="p-2.5 rounded-xl border font-bold">
                  {["Mudah", "Sedang", "Sulit"].map((d) => <option key={d}>{d}</option>)}
                </select>
                <input placeholder="Pertanyaan kuis..." value={qForm.question} onChange={(e) => setQForm({ ...qForm, question: e.target.value })} className="sm:col-span-2 p-2.5 rounded-xl border" />
                <input placeholder="Pilihan A (Jawaban Benar)" value={qForm.opt0} onChange={(e) => setQForm({ ...qForm, opt0: e.target.value })} className="p-2.5 rounded-xl border" />
                <input placeholder="Pilihan B" value={qForm.opt1} onChange={(e) => setQForm({ ...qForm, opt1: e.target.value })} className="p-2.5 rounded-xl border" />
                <input placeholder="Pilihan C" value={qForm.opt2} onChange={(e) => setQForm({ ...qForm, opt2: e.target.value })} className="p-2.5 rounded-xl border" />
                <input placeholder="Pembahasan singkat..." value={qForm.explanation} onChange={(e) => setQForm({ ...qForm, explanation: e.target.value })} className="p-2.5 rounded-xl border" />
                <button
                  type="button"
                  onClick={() => {
                    if (!qForm.question || !qForm.opt0) return;
                    setQuizQuestions([
                      ...quizQuestions,
                      {
                        id: "q-" + Date.now(),
                        category: qForm.category,
                        difficulty: qForm.difficulty,
                        type: "single",
                        question: qForm.question,
                        options: [qForm.opt0, qForm.opt1 || "Pilihan B", qForm.opt2 || "Pilihan C"],
                        answer: [0],
                        hint: "Perhatikan materi dasar kesehatan otak dan jantung.",
                        explanation: qForm.explanation || "Jawaban yang tepat sesuai panduan kesehatan."
                      }
                    ]);
                    setQForm({ ...qForm, question: "", opt0: "", opt1: "", opt2: "", explanation: "" });
                    showToast("Soal Tersimpan", "Pertanyaan baru langsung aktif di BrainQuiz.");
                  }}
                  className="sm:col-span-2 py-2.5 rounded-xl bg-blue-600 text-white font-black"
                >
                  + Tambah Pertanyaan Kuis
                </button>
              </div>
              <div className="space-y-2">
                {quizQuestions.map((q) => (
                  <div key={q.id} className="p-3 rounded-2xl border flex items-center justify-between gap-2">
                    <div>
                      <span className="text-[10px] font-black bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full">{q.category} • {q.difficulty}</span>
                      <p className="font-bold text-sm mt-1">{q.question}</p>
                    </div>
                    <button type="button" onClick={() => setQuizQuestions(quizQuestions.filter((item) => item.id !== q.id))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl">
                      <Icon name="Trash2" className="w-4 h-4" />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {adminTab === "articles" && (
            <div className="bg-white rounded-[2rem] p-6 border border-slate-200 space-y-5">
              <h2 className="text-xl font-black text-slate-900">Kelola Artikel BrainPedia</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl">
                <input placeholder="Judul artikel..." value={aForm.title} onChange={(e) => setAForm({ ...aForm, title: e.target.value })} className="p-2.5 rounded-xl border" />
                <select value={aForm.category} onChange={(e) => setAForm({ ...aForm, category: e.target.value })} className="p-2.5 rounded-xl border font-bold">
                  {["Brain Health", "Heart Health", "Stroke Awareness", "Laboratory Knowledge", "Healthy Lifestyle", "Health Facts"].map((c) => <option key={c}>{c}</option>)}
                </select>
                <input placeholder="Ringkasan singkat..." value={aForm.summary} onChange={(e) => setAForm({ ...aForm, summary: e.target.value })} className="sm:col-span-2 p-2.5 rounded-xl border" />
                <textarea placeholder="Isi artikel lengkap..." value={aForm.content} onChange={(e) => setAForm({ ...aForm, content: e.target.value })} className="sm:col-span-2 p-2.5 rounded-xl border" rows={2} />
                <input placeholder="Fakta menarik..." value={aForm.funFact} onChange={(e) => setAForm({ ...aForm, funFact: e.target.value })} className="p-2.5 rounded-xl border" />
                <input placeholder="Tips kesehatan..." value={aForm.healthTips} onChange={(e) => setAForm({ ...aForm, healthTips: e.target.value })} className="p-2.5 rounded-xl border" />
                <button
                  type="button"
                  onClick={() => {
                    if (!aForm.title) return;
                    setArticles([
                      ...articles,
                      {
                        id: "art-" + Date.now(),
                        title: aForm.title,
                        category: aForm.category,
                        readTime: "3 Menit",
                        illustration: "brain",
                        summary: aForm.summary || "Artikel edukasi kesehatan terpercaya.",
                        content: [aForm.content || aForm.summary || "Menjaga pola hidup sehat sangat penting untuk otak dan jantung."],
                        funFact: aForm.funFact || "Otak membutuhkan suplai oksigen konstan dari jantung.",
                        healthTips: aForm.healthTips || "Rutin berolahraga 30 menit per hari.",
                        reference: aForm.reference
                      }
                    ]);
                    setAForm({ title: "", category: "Brain Health", summary: "", content: "", funFact: "", healthTips: "", reference: "Kemenkes RI" });
                    showToast("Artikel Diterbitkan", "Artikel baru telah tersedia di BrainPedia.");
                  }}
                  className="sm:col-span-2 py-2.5 rounded-xl bg-blue-600 text-white font-black"
                >
                  + Tambah Artikel BrainPedia
                </button>
              </div>
              <div className="space-y-2">
                {articles.map((art) => (
                  <div key={art.id} className="p-3 rounded-2xl border flex items-center justify-between gap-2">
                    <div>
                      <span className="text-[10px] font-black bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full">{art.category}</span>
                      <p className="font-bold text-sm mt-1">{art.title}</p>
                    </div>
                    <button type="button" onClick={() => setArticles(articles.filter((item) => item.id !== art.id))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl">
                      <Icon name="Trash2" className="w-4 h-4" />
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {adminTab === "cases" && (
            <div className="bg-white rounded-[2rem] p-6 border border-slate-200 space-y-5">
              <h2 className="text-xl font-black text-slate-900">Kelola Kasus Pasien Simulasi LabSimulation</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-2xl">
                <input placeholder="Nama Pasien Fiktif" value={caseForm.name} onChange={(e) => setCaseForm({ ...caseForm, name: e.target.value })} className="p-2.5 rounded-xl border" />
                <input type="number" placeholder="Usia" value={caseForm.age} onChange={(e) => setCaseForm({ ...caseForm, age: Number(e.target.value) })} className="p-2.5 rounded-xl border" />
                <select value={caseForm.gender} onChange={(e) => setCaseForm({ ...caseForm, gender: e.target.value })} className="p-2.5 rounded-xl border font-bold">
                  <option>Laki-laki</option>
                  <option>Perempuan</option>
                </select>
                <input placeholder="Keluhan utama pasien..." value={caseForm.complaint} onChange={(e) => setCaseForm({ ...caseForm, complaint: e.target.value })} className="sm:col-span-3 p-2.5 rounded-xl border" />
                <input placeholder="Riwayat kesehatan singkat..." value={caseForm.history} onChange={(e) => setCaseForm({ ...caseForm, history: e.target.value })} className="sm:col-span-3 p-2.5 rounded-xl border" />
                <button
                  type="button"
                  onClick={() => {
                    if (!caseForm.name || !caseForm.complaint) return;
                    const baseTemplate = labCases[0];
                    setLabCases([
                      ...labCases,
                      {
                        ...baseTemplate,
                        id: "case-" + Date.now(),
                        name: caseForm.name,
                        age: caseForm.age || 50,
                        gender: caseForm.gender,
                        complaint: caseForm.complaint,
                        history: caseForm.history || "Riwayat pola makan tinggi gula dan garam."
                      }
                    ]);
                    setCaseForm({ name: "", age: 50, gender: "Laki-laki", complaint: "", history: "" });
                    showToast("Kasus Pasien Ditambahkan", `Kasus ${caseForm.name} siap dimainkan di LabSimulation!`);
                  }}
                  className="sm:col-span-3 py-2.5 rounded-xl bg-blue-600 text-white font-black"
                >
                  + Tambah Kasus Simulasi Baru
                </button>
              </div>
              <div className="space-y-2">
                {labCases.map((c) => (
                  <div key={c.id} className="p-3 rounded-2xl border flex items-center justify-between gap-2">
                    <div>
                      <p className="font-black text-sm">{c.name} ({c.age} thn, {c.gender})</p>
                      <p className="text-xs text-slate-600">{c.complaint}</p>
                    </div>
                    {labCases.length > 1 && (
                      <button type="button" onClick={() => setLabCases(labCases.filter((item) => item.id !== c.id))} className="p-2 text-rose-600 hover:bg-rose-50 rounded-xl">
                        <Icon name="Trash2" className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {adminTab === "adventure" && (
            <div className="bg-white rounded-[2rem] p-6 border border-slate-200 space-y-5">
              <h2 className="text-xl font-black text-slate-900">Kelola Kartu Warna BrainAdventure</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-2xl">
                <select value={advForm.color} onChange={(e) => setAdvForm({ ...advForm, color: e.target.value })} className="p-2.5 rounded-xl border font-bold">
                  <option value="red">Merah – Challenge</option>
                  <option value="green">Hijau – Reward</option>
                  <option value="blue">Biru – Surprise</option>
                </select>
                <input placeholder="Judul Kartu..." value={advForm.title} onChange={(e) => setAdvForm({ ...advForm, title: e.target.value })} className="p-2.5 rounded-xl border" />
                <input type="number" placeholder="Poin" value={advForm.points} onChange={(e) => setAdvForm({ ...advForm, points: Number(e.target.value) })} className="p-2.5 rounded-xl border" />
                <input placeholder="Isi tantangan / pesan hadiah / fakta kejutan..." value={advForm.body} onChange={(e) => setAdvForm({ ...advForm, body: e.target.value })} className="sm:col-span-3 p-2.5 rounded-xl border" />
                <button
                  type="button"
                  onClick={() => {
                    if (!advForm.title || !advForm.body) return;
                    const newEntry =
                      advForm.color === "red"
                        ? { id: "r-" + Date.now(), title: advForm.title, task: advForm.body, points: advForm.points }
                        : advForm.color === "green"
                        ? { id: "g-" + Date.now(), title: advForm.title, message: advForm.body, points: advForm.points }
                        : { id: "b-" + Date.now(), title: advForm.title, info: advForm.body, points: advForm.points };
                    setAdventureCards({ ...adventureCards, [advForm.color]: [...adventureCards[advForm.color], newEntry] });
                    setAdvForm({ color: "red", title: "", body: "", points: 40 });
                    showToast("Kartu Ditambahkan", "Kartu baru siap diacak saat bermain BrainAdventure.");
                  }}
                  className="sm:col-span-3 py-2.5 rounded-xl bg-emerald-600 text-white font-black"
                >
                  + Tambah Kartu BrainAdventure
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
