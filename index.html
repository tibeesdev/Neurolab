    // ========================================================================

    let sharedAudioCtx = null;
    function getAudioContext() {
      if (typeof window === 'undefined') return null;
      if (!sharedAudioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          sharedAudioCtx = new AudioCtx();
        }
      }
      if (sharedAudioCtx && sharedAudioCtx.state !== 'running') {
        sharedAudioCtx.resume().catch(() => {});
      }
      return sharedAudioCtx;
    }

    function unlockAudioWithGesture() {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.02);
      } catch (e) {}
    }

    function playTone(freq = 523.25, duration = 0.22, type = 'triangle', volume = 0.22) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    function playAmbientBacksoundStep(stepIdx) {
      // Melodi utama & arpeggio petik bergaya Morning at the Wooden Pavilion (G Mayor ceria & hangat)
      const leadMelody = [
        783.99, 987.77, 1174.66, 987.77, 880.00, 783.99, 880.00, 987.77,
        659.25, 783.99, 987.77, 1174.66, 1318.51, 1174.66, 987.77, 880.00,
        587.33, 739.99, 880.00, 1174.66, 987.77, 880.00, 739.99, 880.00,
        783.99, 880.00, 987.77, 1174.66, 987.77, 880.00, 783.99, 587.33
      ];
      const acousticArp = [
        392.00, 493.88, 587.33, 493.88, 392.00, 493.88, 587.33, 493.88,
        329.63, 392.00, 493.88, 392.00, 329.63, 392.00, 493.88, 392.00,
        293.66, 369.99, 440.00, 369.99, 293.66, 369.99, 440.00, 369.99,
        392.00, 493.88, 587.33, 493.88, 440.00, 369.99, 392.00, 293.66
      ];
      const bassNotes = [196.00, 196.00, 164.81, 164.81, 146.83, 146.83, 196.00, 146.83];

      const idx = stepIdx % leadMelody.length;
      const melodyFreq = leadMelody[idx];
      const arpFreq = acousticArp[idx];
      const bassFreq = bassNotes[Math.floor(idx / 4) % bassNotes.length];

      // Petikan gitar akustik berpola arpeggio konstan
      playTone(arpFreq, 0.24, 'triangle', 0.13);

      // Melodi utama (gambus/oud & suling lembut)
      playTone(melodyFreq, 0.28, 'triangle', 0.16);
      if (idx % 4 === 0 || idx % 4 === 2) {
        playTone(melodyFreq, 0.36, 'sine', 0.11);
      }

      // Bas akustik & ketukan perkusi kayu ringan
      if (idx % 2 === 0) {
        playTone(bassFreq, 0.32, 'sine', 0.16);
        playTone(135, 0.08, 'sine', 0.14);
      } else {
        playTone(1450, 0.04, 'triangle', 0.045);
      }
    }

    function playSuccessChime() {
      playTone(523.25, 0.15, 'triangle', 0.22);
      setTimeout(() => playTone(659.25, 0.15, 'triangle', 0.22), 110);
      setTimeout(() => playTone(783.99, 0.28, 'triangle', 0.24), 220);
    }

    function playErrorBuzz() {
      playTone(220, 0.18, 'sawtooth', 0.18);
      setTimeout(() => playTone(185, 0.24, 'sawtooth', 0.18), 150);
    }

        )
      };
      return icons[name] || null;
    }

    // 5. MAIN APPLICATION COMPONENT (WITH CLOUD SYNC + SAFE FALLBACK)
    // ========================================================================

    const DEFAULT_COMMUNITY_PLAYERS = [

        emailKey: "ahmad_suryadi_example_com",
        name: "Pak Ahmad Suryadi",
        email: "ahmad.suryadi@example.com",
        xp: 640,
        streak: 6,
        gamesPlayed: 9,
        badgesCount: 3,
        level: "Heart Guardian",
        latestActivity: "LabSimulation: Kasus Pak Ahmad Suryadi",
        updatedAt: 1730000001000

      {
        emailKey: "siti_rahmawati_example_com",
        name: "Ibu Siti Rahmawati",
        email: "siti.rahmawati@example.com",
        xp: 520,
        streak: 5,
        gamesPlayed: 7,
        badgesCount: 2,
        level: "Heart Guardian",
        latestActivity: "BAKTI BrainQuiz (Laboratory Knowledge)",
        updatedAt: 1730000002000
      },
      {
        emailKey: "budi_santoso_example_com",

        email: "budi.santoso@example.com",

        streak: 4,
        gamesPlayed: 5,

        level: "Brain Explorer",
        latestActivity: "BrainDetect: Tanggap Darurat FAST",
        updatedAt: 1730000003000
      }
    ];

    function readJsonStorage(key, fallback) {
      try {
        if (typeof window !== "undefined" && window.localStorage) {
          const raw = window.localStorage.getItem(key);
          if (raw) return JSON.parse(raw);
        }
      } catch (e) {}
      return fallback;
    }

    function writeJsonStorage(key, value) {
      try {
        if (typeof window !== "undefined" && window.localStorage) {
          window.localStorage.setItem(key, JSON.stringify(value));
        }
      } catch (e) {}
    }

    function App() {
      const [fontScale, setFontScale] = useState("normal");
      const [activeTab, setActiveTab] = useState("home");

      const navigateToTab = (targetTab) => {
        const validTabs = ["home", "lab", "quizplay", "adventure", "pedia", "reminder", "profile", "admin"];
        const nextTab = validTabs.includes(targetTab) ? targetTab : "home";
        setActiveTab(nextTab);
        try {
          if (typeof window !== "undefined") {
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        } catch (e) {}
      };

      const [sessionEmail, setSessionEmail] = useState(() => {
        try {
          return (window.localStorage && window.localStorage.getItem("bakti_session_email")) || "";
        } catch (e) {
          return "";

      const [savedAccounts, setSavedAccounts] = useState(() => readJsonStorage("bakti_saved_accounts", {}));
      const [savedProfilesByEmail, setSavedProfilesByEmail] = useState(() => readJsonStorage("bakti_saved_profiles", {}));
      const [showAuthModal, setShowAuthModal] = useState(false);

      const [userStats, setUserStats] = useState({
        name: "Sahabat Sehat",
        email: "",
        isGuest: false,
        xp: 250,
        streak: 3,
        weekDays: [true, true, true, false, false, false, false],
        gamesPlayed: 3,
        badges: ["Brain Explorer"],
        readArticles: ["art-1"],
        history: [
          { title: "Bergabung di BAKTI SmartDoll", points: 50, date: "Hari ini" }
        ]
      });

      const [globalLeaderboard, setGlobalLeaderboard] = useState(() =>
        readJsonStorage("bakti_global_leaderboard", DEFAULT_COMMUNITY_PLAYERS)
      );
      const [labCases, setLabCases] = useState(INITIAL_LAB_CASES);
      const [quizQuestions, setQuizQuestions] = useState(INITIAL_QUIZ_QUESTIONS);
      const [articles, setArticles] = useState(INITIAL_ARTICLES);
      const [adventureCards, setAdventureCards] = useState(INITIAL_ADVENTURE_CARDS);
      const [reminders, setReminders] = useState(INITIAL_REMINDERS);
      const [bookmarkedIds, setBookmarkedIds] = useState(["art-1", "art-2"]);
      const [toast, setToast] = useState(null);

      const [bgmEnabled, setBgmEnabled] = useState(false);
      const bgmStepRef = useRef(0);

      const showToast = (title, message, type = "success") => {
        setToast({ title, message, type });
        if (type === "success") playSuccessChime();
        setTimeout(() => setToast(null), 4500);
      };

      useEffect(() => {
        if (!bgmEnabled) return;
        const interval = setInterval(() => {
          playAmbientBacksoundStep(bgmStepRef.current);
          bgmStepRef.current += 1;
        }, 235);
        return () => clearInterval(interval);
      }, [bgmEnabled]);

      const toggleBacksound = () => {
        unlockAudioWithGesture();
        if (!bgmEnabled) {
          setBgmEnabled(true);
          playAmbientBacksoundStep(bgmStepRef.current);
          bgmStepRef.current += 1;
          showToast("Musik Latar Aktif", "Backsound ceria sedang diputar.");
        } else {
          setBgmEnabled(false);
        }
      };

      const getUserLevel = (xp) => {
        if (xp >= 1200) return { name: "Health Champion", next: 2000, tier: 5 };
        if (xp >= 800) return { name: "Lab Detective", next: 1200, tier: 4 };
        if (xp >= 500) return { name: "Heart Guardian", next: 800, tier: 3 };
        if (xp >= 200) return { name: "Brain Explorer", next: 500, tier: 2 };
        return { name: "Health Beginner", next: 200, tier: 1 };
      };

      const levelInfo = getUserLevel(userStats.xp);

      const activeEmail = (sessionEmail || "").trim().toLowerCase();
      const emailDocKey = activeEmail ? activeEmail.replace(/[^a-z0-9]/g, "_") : "";

      useEffect(() => {
        if (!activeEmail || !emailDocKey) return;
        const cachedProfile = savedProfilesByEmail[emailDocKey];
        if (cachedProfile) {
          setUserStats((prev) => ({
            ...prev,
            ...cachedProfile,
            email: activeEmail,
            isGuest: false
          }));
          if (cachedProfile.reminders) setReminders(cachedProfile.reminders);
          if (cachedProfile.bookmarkedIds) setBookmarkedIds(cachedProfile.bookmarkedIds);
          if (cachedProfile.fontScale) setFontScale(cachedProfile.fontScale);
        }
      }, [activeEmail, emailDocKey]);

      const persistUserProgress = (nextStats, extraFields = {}) => {
        setUserStats(nextStats);
        if (!activeEmail || !emailDocKey) return;

        const lbEntry = {
          uid: `email_${emailDocKey}`,
          emailKey: emailDocKey,
          name: nextStats.name,
          email: activeEmail,
          xp: nextStats.xp,
          streak: nextStats.streak,
          gamesPlayed: nextStats.gamesPlayed || 0,
          readArticlesCount: (nextStats.readArticles || []).length,
          latestActivity: extraFields.latestActivity || nextStats.history?.[0]?.title || "Aktif belajar sehat",
          level: getUserLevel(nextStats.xp).name,
          badgesCount: (nextStats.badges || []).length,
          isGuest: false,
          updatedAt: Date.now()
        };

        const mergedProfile = {
          ...nextStats,
          email: activeEmail,
          reminders: extraFields.reminders || reminders,
          bookmarkedIds: extraFields.bookmarkedIds || bookmarkedIds,
          fontScale: extraFields.fontScale || fontScale
        };

        setSavedProfilesByEmail((prev) => {
          const updated = { ...prev, [emailDocKey]: mergedProfile };
          writeJsonStorage("bakti_saved_profiles", updated);
          return updated;
        });

        setGlobalLeaderboard((prev) => {
          const filtered = prev.filter(
            (item) => item.emailKey !== emailDocKey && (item.email || "").toLowerCase() !== activeEmail
          );
          const sorted = [...filtered, lbEntry].sort((a, b) => (b.xp || 0) - (a.xp || 0));
          writeJsonStorage("bakti_global_leaderboard", sorted);
          return sorted;
        });
      };

      const awardXP = (points, activityTitle, newBadge = null) => {
        const updatedBadges = newBadge && !userStats.badges.includes(newBadge)
          ? [...userStats.badges, newBadge]
          : userStats.badges;
        const nextStats = {
          ...userStats,
          xp: userStats.xp + points,
          gamesPlayed: userStats.gamesPlayed + 1,
          badges: updatedBadges,
          history: [{ title: activityTitle, points, date: "Baru saja" }, ...(userStats.history || []).slice(0, 14)]
        };
        persistUserProgress(nextStats, { latestActivity: activityTitle, lastActiveAt: Date.now() });
        showToast(`+${points} Health Points!`, `${activityTitle} tersimpan & terlihat di Papan Peringkat!${newBadge ? ` Badge Baru: ${newBadge}!` : ""}`);
      };

      const handleFontScaleChange = (newScale) => {
        setFontScale(newScale);
      };

      useEffect(() => {
        const rootEl = document.documentElement;
        if (fontScale === "xlarge") {
          rootEl.style.fontSize = "21px";
        } else if (fontScale === "large") {
          rootEl.style.fontSize = "18.5px";
        } else {
          rootEl.style.fontSize = "16px";
        }
        return () => {
          rootEl.style.fontSize = "16px";
        };
      }, [fontScale]);

      const handleLogout = () => {
        setBgmEnabled(false);
        setSessionEmail("");
        try {
          if (window.localStorage) window.localStorage.removeItem("bakti_session_email");
        } catch (e) {}
        navigateToTab("home");
        showToast("Berhasil Keluar", "Silakan masuk kembali dengan email dan kata sandi untuk melanjutkan.");
      };

      const fontScaleClass =
        fontScale === "xlarge"
          ? "text-lg sm:text-xl leading-relaxed"
          : fontScale === "large"
          ? "text-base sm:text-lg leading-relaxed"
          : "text-sm sm:text-base leading-normal";

      const navItems = [
        { id: "home", label: "Beranda", iconName: "Heart" },
        { id: "lab", label: "LabSim", iconName: "FlaskConical" },
        { id: "quizplay", label: "Quiz & Play", iconName: "Brain" },
        { id: "adventure", label: "BrainAdventure", iconName: "Sparkles" },
        { id: "pedia", label: "BrainPedia", iconName: "BookOpen" },
        { id: "reminder", label: "Pengingat", iconName: "Bell" },
        { id: "profile", label: "Peringkat", iconName: "Trophy" }
      ];

      if (!activeEmail) {
        return (
          <EmailLoginGateScreen
            fontScale={fontScale}
            onFontScaleChange={setFontScale}
            fontScaleClass={fontScaleClass}
            savedAccounts={savedAccounts}
            savedProfilesByEmail={savedProfilesByEmail}
            onSaveAccount={(key, rec) => {
              setSavedAccounts((prev) => {
                const updated = { ...prev, [key]: rec };
                writeJsonStorage("bakti_saved_accounts", updated);
                return updated;
              });
            }}
            onAuthenticated={({ email, name, profileData }) => {
              const clean = email.trim().toLowerCase();
              const key = clean.replace(/[^a-z0-9]/g, "_");
              const resolvedName = name || profileData?.name || clean.split("@")[0];
              const resolvedProfile = profileData || {
                name: resolvedName,
                email: clean,
                emailVerified: true,
                xp: 250,
                streak: 1,
                weekDays: [true, false, false, false, false, false, false],
                gamesPlayed: 0,
                badges: ["Brain Explorer"],
                readArticles: [],
                history: [{ title: `Terhubung dengan Email (${clean})`, points: 50, date: "Hari ini" }]
              };

              setSessionEmail(clean);
              try {
                if (window.localStorage) window.localStorage.setItem("bakti_session_email", clean);
              } catch (e) {}

              setUserStats({
                ...resolvedProfile,
                name: resolvedName,
                email: clean,
                isGuest: false
              });
              if (resolvedProfile.reminders) setReminders(resolvedProfile.reminders);
              if (resolvedProfile.bookmarkedIds) setBookmarkedIds(resolvedProfile.bookmarkedIds);
              if (resolvedProfile.fontScale) setFontScale(resolvedProfile.fontScale);

              const lvlName =
                resolvedProfile.xp >= 1200
                  ? "Health Champion"
                  : resolvedProfile.xp >= 800
                  ? "Lab Detective"
                  : resolvedProfile.xp >= 500
                  ? "Heart Guardian"
                  : resolvedProfile.xp >= 200
                  ? "Brain Explorer"
                  : "Health Beginner";

              setSavedProfilesByEmail((prev) => {
                const updated = { ...prev, [key]: { ...resolvedProfile, name: resolvedName, email: clean } };
                writeJsonStorage("bakti_saved_profiles", updated);
                return updated;
              });

              setGlobalLeaderboard((prev) => {
                const filtered = prev.filter(
                  (item) => item.emailKey !== key && (item.email || "").toLowerCase() !== clean
                );
                const sorted = [
                  ...filtered,
                  {
                    uid: `email_${key}`,
                    emailKey: key,
                    name: resolvedName,
                    email: clean,
                    xp: resolvedProfile.xp,
                    streak: resolvedProfile.streak || 1,
                    gamesPlayed: resolvedProfile.gamesPlayed || 0,
                    readArticlesCount: (resolvedProfile.readArticles || []).length,
                    latestActivity: resolvedProfile.history?.[0]?.title || `Login Email (${clean})`,
                    level: lvlName,
                    badgesCount: (resolvedProfile.badges || []).length,
                    isGuest: false,
                    updatedAt: Date.now()
                  }
                ].sort((a, b) => (b.xp || 0) - (a.xp || 0));
                writeJsonStorage("bakti_global_leaderboard", sorted);
                return sorted;
              });

              navigateToTab("home");
              showToast("Akun Email Terhubung!", `Selamat datang ${clean}! Progresmu tersimpan & tampil di Papan Peringkat Global.`);
            }}
          />

            <div className="fixed top-20 right-4 left-4 sm:left-auto sm:w-96 z-50 animate-bounce">
              <div className={`rounded-3xl p-4 shadow-2xl border-2 flex items-start gap-3 ${
                toast.type === "warning" ? "bg-amber-50 border-amber-400 text-amber-950" : "bg-white border-blue-500 text-slate-900"

                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center flex-shrink-0 shadow">
                  <Icon name="Sparkles" className="w-5 h-5" />

                <div className="flex-1">
                  <p className="font-extrabold text-blue-700">{toast.title}</p>
                  <p className="text-sm text-slate-600 mt-0.5">{toast.message}</p>
                </div>
                <button type="button" onClick={() => setToast(null)} className="text-slate-400 hover:text-slate-700 font-bold px-1">✕</button>
              </div>
            </div>
          )}

          {showAuthModal && (
            <EmailAuthModal
              activeEmail={activeEmail}
              userStats={userStats}
              onClose={() => setShowAuthModal(false)}

              }}
            />

                onClick={() => navigateToTab("home")}
                className="flex items-center gap-2.5 text-left group focus:outline-none"

                  <Icon name="Brain" className="w-6 h-6" />
                  <Icon name="Heart" className="w-3.5 h-3.5 text-amber-300 fill-amber-300 absolute bottom-1.5 right-1.5" />
                </div>
                <div>
                  <span className="font-black tracking-tight text-blue-700 text-lg sm:text-xl block leading-tight">
                    BAKTI SmartDoll
                  </span>
                  <p className="text-[11px] text-slate-500 font-semibold hidden sm:block">
                    Learn, Play, Explore &amp; Stay Healthy
                  </p>
                </div>
              </button>

              <div className="flex items-center gap-1.5 sm:gap-2">
                <button
                  type="button"
                  onClick={toggleBacksound}
                  title={bgmEnabled ? "Matikan Musik Latar" : "Putar Musik Latar"}
                  className={`flex items-center gap-1.5 px-2.5 sm:px-3.5 py-1.5 rounded-2xl border font-extrabold text-xs transition-all ${
                    bgmEnabled
                      ? "bg-amber-500 text-white border-amber-600 shadow-sm"
                      : "bg-amber-50 text-amber-900 border-amber-300 hover:bg-amber-100"
                  }`}

                  {bgmEnabled ? (
                    <Icon name="Volume2" className="w-4 h-4 animate-pulse" />

                    <Icon name="VolumeX" className="w-4 h-4" />
                  )}

                <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-200" role="group" aria-label="Ukuran Huruf">
                  <span className="text-xs font-bold text-slate-500 px-2 hidden lg:inline">Huruf:</span>
                  {[
                    { id: "normal", label: "A", title: "Normal" },
                    { id: "large", label: "A+", title: "Besar (Lansia)" },
                    { id: "xlarge", label: "A++", title: "Sangat Besar" }
                  ].map((item) => (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => handleFontScaleChange(item.id)}
                      title={item.title}
                      className={`px-2.5 py-1 rounded-xl font-extrabold text-xs sm:text-sm transition-all ${
                        fontScale === item.id
                          ? "bg-blue-600 text-white shadow-sm scale-105"
                          : "text-slate-600 hover:bg-white"
                      }`}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                <button
                  type="button"
                  onClick={() => navigateToTab("profile")}
                  className="flex items-center gap-1 bg-orange-50 hover:bg-orange-100 border border-orange-200 px-2.5 py-1.5 rounded-2xl transition"
                  title="Daily Streak"
                >
                  <Icon name="Flame" className="w-4 h-4 text-orange-500 fill-orange-500" />
                  <span className="font-extrabold text-orange-700 text-xs sm:text-sm">{userStats.streak}d</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateToTab("profile")}
                  className="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-2.5 sm:px-3 py-1.5 rounded-2xl shadow-sm transition"
                  title="Health Points"
                >
                  <Icon name="Star" className="w-4 h-4 text-amber-300 fill-amber-300" />
                  <span className="font-extrabold text-xs sm:text-sm">{userStats.xp} HP</span>
                </button>

                <button
                  type="button"
                  onClick={() => setShowAuthModal(true)}
                  className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-2xl border font-extrabold text-xs sm:text-sm transition bg-emerald-50 border-emerald-300 text-emerald-800 hover:bg-emerald-100"
                  title="Info Akun Email & Keluar"
                >
                  <Icon name="Mail" className="w-4 h-4" />
                  <span>{activeEmail.split("@")[0]}</span>
                </button>

                <button
                  type="button"
                  onClick={() => navigateToTab("admin")}
                  className={`p-2 rounded-2xl border transition ${
                    activeTab === "admin"
                      ? "bg-slate-800 text-white border-slate-800"
                      : "bg-white text-slate-600 border-slate-200 hover:bg-slate-100"
                  }`}
                  title="Dashboard Administrator"
                >
                  <Icon name="Settings" className="w-4 h-4 sm:w-5 sm:h-5" />
                </button>
              </div>
            </div>

            <nav className="hidden md:block bg-blue-50/60 border-t border-blue-100">
              <div className="max-w-7xl mx-auto px-6 py-2 flex items-center gap-1.5 overflow-x-auto">
                {navItems.map((item) => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => navigateToTab(item.id)}
                      className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-bold text-sm whitespace-nowrap transition-all ${
                        active
                          ? "bg-blue-600 text-white shadow-md shadow-blue-200 scale-[1.02]"
                          : "text-slate-600 hover:bg-white hover:text-blue-700"
                      }`}
                    >
                      <Icon name={item.iconName} className="w-4 h-4" />
                      {item.label}
                    </button>
                  );
                })}
              </div>
            </nav>
          </header>

          <main className="max-w-7xl mx-auto px-3 sm:px-6 pt-5 sm:pt-7">
            {activeTab === "home" && (
              <HomeView
                activeEmail={activeEmail}
                userStats={userStats}
                levelInfo={levelInfo}
                globalLeaderboard={globalLeaderboard}
                onNavigate={navigateToTab}
              />
            )}

            {activeTab === "lab" && (
              <LabSimulationView
                cases={labCases}
                onAwardXP={awardXP}
                onBackHome={() => navigateToTab("home")}
              />
            )}

            {activeTab === "quizplay" && (
              <BrainQuizPlayView
                questions={quizQuestions}
                userStats={userStats}
                levelInfo={levelInfo}
                onAwardXP={awardXP}
              />
            )}

            {activeTab === "adventure" && (
              <BrainAdventureView
                cards={adventureCards}
                onAwardXP={awardXP}
              />
            )}

            {activeTab === "pedia" && (
              <BrainPediaView
                articles={articles}
                bookmarkedIds={bookmarkedIds}
                readArticles={userStats.readArticles || []}
                onToggleBookmark={(id) => {
                  const nextBm = bookmarkedIds.includes(id)
                    ? bookmarkedIds.filter((item) => item !== id)
                    : [...bookmarkedIds, id];
                  setBookmarkedIds(nextBm);
                  persistUserProgress(userStats, { bookmarkedIds: nextBm });
                }}
                onMarkRead={(id, title) => {
                  const currentRead = userStats.readArticles || [];
                  if (!currentRead.includes(id)) {
                    const nextStats = { ...userStats, readArticles: [...currentRead, id] };
                    persistUserProgress(nextStats);
                    awardXP(20, `Membaca Artikel: ${title}`);
                  }
                }}
              />
            )}

            {activeTab === "reminder" && (
              <HealthyReminderView
                reminders={reminders}
                setReminders={(updater) => {
                  const nextRem = typeof updater === "function" ? updater(reminders) : updater;
                  setReminders(nextRem);
                  persistUserProgress(userStats, { reminders: nextRem });
                }}
                onTriggerToast={showToast}
                onAwardXP={awardXP}
              />
            )}

            {activeTab === "profile" && (
              <ProfileLeaderboardView
                activeEmail={activeEmail}
                userStats={userStats}
                globalLeaderboard={globalLeaderboard}
                onRefreshLeaderboard={() => {
                  persistUserProgress(userStats, { latestActivity: userStats.history?.[0]?.title || "Memperbarui peringkat" });
                  showToast("Peringkat Diperbarui", "Data poin dan peringkat terbaru telah disinkronkan.");
                }}
                onUpdateName={(newName) => {
                  const nextStats = { ...userStats, name: newName };
                  persistUserProgress(nextStats);
                  showToast("Nama Diperbarui", `Nama tampilan di Papan Peringkat Global sekarang "${newName}".`);
                }}
                onLogout={handleLogout}
                levelInfo={levelInfo}
                reminders={reminders}
              />
            )}

            {activeTab === "admin" && (
              <AdminDashboardView
                labCases={labCases}
                setLabCases={setLabCases}
                quizQuestions={quizQuestions}
                setQuizQuestions={setQuizQuestions}
                articles={articles}
                setArticles={setArticles}
                adventureCards={adventureCards}
                setAdventureCards={setAdventureCards}
                globalLeaderboard={globalLeaderboard}
                showToast={showToast}
              />
            )}
          </main>

          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t-2 border-blue-100 shadow-[0_-4px_20px_rgba(37,99,235,0.08)] px-1 py-1.5">
            <div className="flex items-center justify-around">
              {[

    // 6A. MANDATORY EMAIL LOGIN GATE (STRICT PASSWORD VERIFICATION + CLOUD SYNC)
    // ========================================================================

    async function hashPasswordSHA256(plain) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const bytes = new TextEncoder().encode(`bakti_smartdoll_v1_${plain}`);
          const digest = await window.crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest))
            .map((b) => b.toString(16).padStart(2, "0"))
            .join("");
        }
      } catch (e) {}
      return btoa(unescape(encodeURIComponent(`bakti_smartdoll_v1_${plain}`)));
    }

    function EmailLoginGateScreen({
      fontScale,
      onFontScaleChange,
      fontScaleClass,
      savedAccounts,
      savedProfilesByEmail,
      onSaveAccount,
      onAuthenticated
    }) {
      const [isRegister, setIsRegister] = useState(false);
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [busy, setBusy] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      const handleLoginOrRegister = async (e) => {
        e.preventDefault();
        setErrorMsg("");
        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
          setErrorMsg("Masukkan alamat email yang valid (contoh: nama@gmail.com).");
          playErrorBuzz();
          return;
        }
        if (password.length < 6) {
          setErrorMsg("Kata sandi minimal 6 karakter.");
          playErrorBuzz();
          return;
        }

        setBusy(true);
        const emailKey = cleanEmail.replace(/[^a-z0-9]/g, "_");
        const passHash = await hashPasswordSHA256(password);

        try {
          if (isRegister) {
            if (savedAccounts[emailKey]) {
              throw new Error("EMAIL_EXISTS");
            }
            const displayName = name.trim() || cleanEmail.split("@")[0];
            const newAccount = {
              email: cleanEmail,
              name: displayName,
              passHash,
              createdAt: Date.now()
            };
            onSaveAccount(emailKey, newAccount);
            onAuthenticated({
              firebaseUser: null,
              email: cleanEmail,
              name: displayName,
              emailVerified: true,
              profileData: savedProfilesByEmail[emailKey] || null
            });
          } else {
            const existingAccount = savedAccounts[emailKey];
            if (!existingAccount) {
              throw new Error("USER_NOT_FOUND");
            }
            if (existingAccount.passHash !== passHash) {
              throw new Error("WRONG_PASSWORD");
            }
            const existingProfile = savedProfilesByEmail[emailKey] || null;
            onAuthenticated({
              firebaseUser: null,
              email: cleanEmail,
              name: existingProfile?.name || existingAccount.name || cleanEmail.split("@")[0],
              emailVerified: true,
              profileData: existingProfile
            });
          }
        } catch (err) {
          playErrorBuzz();
          if (err && err.message === "EMAIL_EXISTS") {
            setErrorMsg("Alamat email ini sudah terdaftar. Silakan masuk di tab \"Masuk Akun Email\".");
          } else if (err && err.message === "WRONG_PASSWORD") {
            setErrorMsg("Kata sandi salah! Silakan masukkan kata sandi yang benar untuk akun email ini.");
          } else if (err && err.message === "USER_NOT_FOUND") {
            setErrorMsg("Email ini belum terdaftar. Silakan klik tab \"Daftar Akun Baru\" terlebih dahulu.");
          } else {
            setErrorMsg("Terjadi kesalahan saat memverifikasi akun. Periksa kembali email dan kata sandi Anda.");
          }
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className={`min-h-screen bg-gradient-to-br from-blue-700 via-blue-600 to-rose-600 flex flex-col justify-between p-4 sm:p-6 relative overflow-hidden ${fontScaleClass}`}>

              </div>
              <div>
                <span className="font-black text-lg sm:text-xl block leading-tight">BAKTI SmartDoll</span>
                <span className="text-xs text-blue-100 font-semibold">Learn, Play, Explore &amp; Stay Healthy</span>
              </div>
            </div>

            <div className="flex items-center gap-1 bg-white/20 backdrop-blur p-1.5 rounded-2xl border border-white/30" role="group" aria-label="Ukuran Huruf">
              <span className="text-xs font-extrabold text-white px-1.5 hidden sm:inline">Ukuran Huruf:</span>
              {[
                { id: "normal", label: "A", title: "Normal" },
                { id: "large", label: "A+", title: "Besar" },
                { id: "xlarge", label: "A++", title: "Sangat Besar" }
              ].map((item) => (
                <button

                  onClick={() => onFontScaleChange(item.id)}
                  className={`px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm transition ${

                </button>

            </div>
          </div>

          <div className="relative z-10 max-w-4xl w-full mx-auto my-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">

              <div className="bg-white/95 text-slate-800 rounded-3xl p-4 shadow-xl border-2 border-amber-300">

              <form onSubmit={handleLoginOrRegister} className="space-y-3.5">

                    </label>
                    <input

                <div>

                  </label>
                  <input
                    type="email"
                    required

                  <input

                <button

      const [step6Choice, setStep6Choice] = useState(null);
      const [step7Decision, setStep7Decision] = useState(null);

        return () => clearInterval(timer);

        setScore(0);
        setCorrectCount(0);
        setWrongCount(0);
        setTimeLeft(180);

        setStep(1);
        setStep1Choice(null);

        setMatchedMap({});
        setInterpretations({});

        setStep6Choice(null);
        setStep7Decision(null);

        if (isCorrect) {
          setScore((s) => s + pts);
          setCorrectCount((c) => c + 1);
          playSuccessChime();
        } else {
          setWrongCount((w) => w + 1);

        if (currentStep === 3) return teamPlayers[1];
        if (currentStep <= 5) return teamPlayers[2];
        if (currentStep === 6) return teamPlayers[3];
        return teamPlayers[4];

    function QuizEngine({ questions, onAwardXP, onExit }) {
      const [category, setCategory] = useState("Semua");
      const [difficulty, setDifficulty] = useState("Semua");
      const [useTimer, setUseTimer] = useState(false);
      const [started, setStarted] = useState(false);
      const [quizPool, setQuizPool] = useState([]);
      const [qIdx, setQIdx] = useState(0);
      const [selectedOpts, setSelectedOpts] = useState([]);
      const [answered, setAnswered] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [score, setScore] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [seconds, setSeconds] = useState(0);

      const categories = ["Semua", "Brain Health", "Heart Health", "Blood Circulation", "Laboratory Knowledge", "Stroke Awareness", "Healthy Lifestyle"];

      useEffect(() => {
        if (!started || !useTimer || qIdx >= quizPool.length) return;
        const t = setInterval(() => setSeconds((s) => s + 1), 1000);
        return () => clearInterval(t);
      }, [started, useTimer, qIdx, quizPool.length]);

      const startQuiz = () => {
        let filtered = questions.filter((q) => (category === "Semua" || q.category === category) && (difficulty === "Semua" || q.difficulty === difficulty));
        if (filtered.length === 0) filtered = questions;
        setQuizPool([...filtered].sort(() => Math.random() - 0.5));
        setQIdx(0);
        setSelectedOpts([]);
        setAnswered(false);
        setShowHint(false);
        setScore(0);
        setCorrectCount(0);
        setSeconds(0);
        setStarted(true);
      };

      if (!started) {
        return (
          <div className="bg-white rounded-[2rem] p-6 border-2 border-blue-100 space-y-5">
            <h2 className="text-2xl font-black text-blue-800">Pengaturan BAKTI BrainQuiz</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block font-extrabold text-sm text-slate-700 mb-1.5">Pilih Kategori Materi:</label>
                <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full p-3 rounded-2xl border-2 border-slate-200 font-bold bg-slate-50">
                  {categories.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="block font-extrabold text-sm text-slate-700 mb-1.5">Tingkat Kesulitan:</label>
                <select value={difficulty} onChange={(e) => setDifficulty(e.target.value)} className="w-full p-3 rounded-2xl border-2 border-slate-200 font-bold bg-slate-50">
                  {["Semua", "Mudah", "Sedang", "Sulit"].map((d) => <option key={d} value={d}>{d}</option>)}
                </select>
              </div>
            </div>
            <label className="flex items-center gap-3 p-3.5 rounded-2xl bg-amber-50 border border-amber-200 cursor-pointer">
              <input type="checkbox" checked={useTimer} onChange={(e) => setUseTimer(e.target.checked)} className="w-5 h-5 accent-blue-600" />

      const currentQ = quizPool[qIdx];
      const isMulti = currentQ.type === "multi";

      const submitAnswer = () => {
        setAnswered(true);
        const isCorrect = selectedOpts.length === currentQ.answer.length && currentQ.answer.every((a) => selectedOpts.includes(a));
        if (isCorrect) {
          setScore((s) => s + 20);
          setCorrectCount((c) => c + 1);
          playSuccessChime();
        } else {
          playErrorBuzz();

              Pertanyaan {qIdx + 1} dari {quizPool.length} • {currentQ.category} ({currentQ.difficulty})
            </span>
            <div className="flex items-center gap-2">
              {useTimer && <span className="text-xs font-black bg-amber-100 text-amber-800 px-3 py-1 rounded-full">⏱️ {seconds}s</span>}
              <button type="button" onClick={() => setShowHint(!showHint)} className="text-xs font-extrabold bg-amber-50 border border-amber-300 text-amber-800 px-3 py-1 rounded-full">
                💡 Petunjuk
              </button>
            </div>
          </div>

          {showHint && (
            <div className="p-3 rounded-2xl bg-amber-50 border border-amber-300 text-sm text-amber-950 font-semibold">
              💡 Petunjuk Bakti: {currentQ.hint}
            </div>
          )}

          <h3 className="text-xl font-black text-slate-900">{currentQ.question}</h3>

          <div className="space-y-2.5">
            {currentQ.options.map((opt, idx) => {
              const picked = selectedOpts.includes(idx);
              const isAns = currentQ.answer.includes(idx);
              return (
                <button
                  key={idx}
                  type="button"
                  disabled={answered}
                  onClick={() => isMulti ? setSelectedOpts((p) => (p.includes(idx) ? p.filter((x) => x !== idx) : [...p, idx])) : setSelectedOpts([idx])}
                  className={`w-full text-left p-4 rounded-2xl border-2 font-bold transition ${
                    answered ? (isAns ? "border-emerald-500 bg-emerald-50 text-emerald-950" : picked ? "border-rose-500 bg-rose-50 text-rose-950" : "border-slate-100 opacity-60") : picked ? "border-blue-600 bg-blue-50 text-blue-900" : "border-slate-200 hover:border-blue-400"
                  }`}
                >
                  {opt}
                </button>
              );
            })}
          </div>

          {!answered ? (
            <button type="button" disabled={selectedOpts.length === 0} onClick={submitAnswer} className="px-6 py-3 rounded-2xl bg-blue-600 disabled:bg-slate-300 text-white font-black shadow">
              Periksa Jawaban
            </button>
          ) : (
            <div className="p-4 rounded-2xl bg-blue-50 border-2 border-blue-200 space-y-3">
              <p className="font-black text-blue-900">Pembahasan Kesehatan:</p>
              <p className="text-slate-700">{currentQ.explanation}</p>
              <button
                type="button"
                onClick={() => {
                  if (qIdx + 1 === quizPool.length) onAwardXP(score, `BAKTI BrainQuiz (${category})`, "Brain Master");
                  setQIdx((i) => i + 1);

                  setShowHint(false);
                }}
                className="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-black"
              >
                {qIdx + 1 === quizPool.length ? "Lihat Hasil Akhir →" : "Pertanyaan Berikutnya →"}
              </button>
            </div>
          )}
        </div>
      );

    function BrainPuzzleGame({ onAwardXP, onExit }) {
      const [topic, setTopic] = useState("Anatomi Otak");
      const [tiles, setTiles] = useState([2, 0, 5, 1, 4, 8, 3, 7, 6]);
      const [selectedIdx, setSelectedIdx] = useState(null);
      const [moves, setMoves] = useState(0);
      const [completed, setCompleted] = useState(false);

      const labelsByTopic = {
        "Anatomi Otak": ["1. Lobus Frontal", "2. Lobus Parietal", "3. Lobus Oksipital", "4. Lobus Temporal", "5. Korteks Motorik", "6. Hipokampus", "7. Talamus", "8. Otak Kecil", "9. Batang Otak"],
        "Anatomi Jantung": ["1. Aorta Utama", "2. Vena Kava", "3. Arteri Pulmonalis", "4. Serambi Kanan", "5. Katup Trikuspid", "6. Serambi Kiri", "7. Bilik Kanan", "8. Septum Jantung", "9. Bilik Kiri"]
      };
      const currentLabels = labelsByTopic[topic];

      const handleTileClick = (idx) => {
        if (completed) return;
        if (selectedIdx === null) {
          setSelectedIdx(idx);
        } else {
          const next = [...tiles];
          [next[selectedIdx], next[idx]] = [next[idx], next[selectedIdx]];
          setTiles(next);
          setSelectedIdx(null);
          setMoves((m) => m + 1);
          playTone(440, 0.08);
          if (next.every((val, i) => val === i)) {
            setCompleted(true);
            onAwardXP(75, `BrainPuzzle: ${topic}`);
          }
        }
      };

      return (
        <div className="bg-white rounded-[2rem] p-6 border-2 border-amber-200 space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-2xl font-black text-amber-900">🖼️ BrainPuzzle – Susun Urutan Anatomi 1–9</h2>
              <p className="text-sm text-slate-600">Klik dua kotak untuk menukar posisinya hingga berurutan dari 1 sampai 9!</p>
            </div>
            <div className="flex gap-2">
              {Object.keys(labelsByTopic).map((t) => (
                <button
                  key={t}
                  type="button"
                  onClick={() => { setTopic(t); setTiles([2, 0, 5, 1, 4, 8, 3, 7, 6]); setMoves(0); setCompleted(false); }}
                  className={`px-3 py-1.5 rounded-xl font-extrabold text-xs ${topic === t ? "bg-amber-500 text-white" : "bg-slate-100 text-slate-700"}`}
                >
                  {t}
                </button>
              ))}
            </div>
          </div>

          <div className="flex items-center justify-between text-sm font-bold text-slate-600 max-w-md mx-auto">
            <span>Jumlah Langkah: {moves}</span>
            <button type="button" onClick={() => { setTiles([0, 1, 2, 3, 4, 5, 6, 7, 8]); setCompleted(true); onAwardXP(50, `BrainPuzzle: ${topic}`); }} className="text-xs text-blue-600 underline">
              Bantu Susun Otomatis
            </button>
          </div>

          <div className="grid grid-cols-3 gap-2.5 max-w-md mx-auto">
            {tiles.map((pieceId, idx) => {
              const isCorrectPos = pieceId === idx;
              const isPicked = selectedIdx === idx;
              return (
                <button
                  key={idx}
                  type="button"
                  onClick={() => handleTileClick(idx)}
                  className={`aspect-square rounded-2xl p-2 flex flex-col items-center justify-center text-center font-black border-2 transition-all ${
                    isPicked ? "bg-blue-600 text-white border-blue-800 scale-105 shadow-lg" : isCorrectPos ? "bg-emerald-50 text-emerald-900 border-emerald-400" : "bg-amber-50 text-amber-950 border-amber-300 hover:bg-amber-100"
                  }`}
                >
                  <span className="text-lg">{pieceId + 1}</span>
                  <span className="text-[11px] leading-tight mt-1">{currentLabels[pieceId].replace(/^\d+\.\s/, "")}</span>
                </button>
              );
            })}
          </div>

          {completed && (
            <div className="p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-400 text-center space-y-2">
              <p className="font-black text-emerald-900">🎉 Hebat! Puzzle {topic} tersusun utuh dalam {moves} langkah!</p>
              <button type="button" onClick={onExit} className="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-black">Selesai →</button>
            </div>
          )}
        </div>
      );
    }

                    <button

                  {checked && <span className={`text-xs font-black ${isRight ? "text-emerald-700" : "text-rose-700"}`}>{isRight ? "✅ Tepat" : "❌ Kurang Tepat"}</span>}

            <button

              Periksa Pengelompokan
            </button>
          ) : (
            <button type="button" onClick={onExit} className="px-6 py-3 rounded-2xl bg-blue-600 text-white font-black">Selesai &amp; Kembali →</button>
          )}
        </div>
      );
    }

    function BrainAdventureView({ cards, onAwardXP }) {
      const [gameMode, setGameMode] = useState("individu");
      const [players, setPlayers] = useState([
        { name: "Pemain 1", score: 0, activities: 0, quizCorrect: 0 },
        { name: "Pemain 2", score: 0, activities: 0, quizCorrect: 0 }
      ]);
      const [currentTurn, setCurrentTurn] = useState(0);
      const [stepInstruction, setStepInstruction] = useState(null);
      const [activeCard, setActiveCard] = useState(null);
      const [quizAnswered, setQuizAnswered] = useState(null);
      const [gameEnded, setGameEnded] = useState(false);

      const stepInstructionsPool = [
        { text: "Maju 5 langkah!", dir: "maju", steps: 5 },
        { text: "Maju 3 langkah!", dir: "maju", steps: 3 },
        { text: "Maju 2 langkah!", dir: "maju", steps: 2 },
        { text: "Maju 4 langkah!", dir: "maju", steps: 4 },
        { text: "Mundur 1 langkah!", dir: "mundur", steps: 1 },
        { text: "Mundur 2 langkah!", dir: "mundur", steps: 2 },
        { text: "Mundur 3 langkah!", dir: "mundur", steps: 3 }
      ];

      const handleRollStep = () => {
        const picked = stepInstructionsPool[Math.floor(Math.random() * stepInstructionsPool.length)];
        setStepInstruction(picked);
        setActiveCard(null);
        setQuizAnswered(null);
        playTone(587.33, 0.15, "triangle");
      };

      const handlePickColor = (colorKey) => {
        const pool = cards[colorKey] || [];
        if (pool.length === 0) return;
        const picked = pool[Math.floor(Math.random() * pool.length)];
        setActiveCard({ color: colorKey, data: picked });
        setQuizAnswered(null);
        playTone(659.25, 0.15, "sine");
      };

      const handleCompleteActivity = (earnedPts, isQuizRight = false) => {
        setPlayers((prev) =>
          prev.map((pl, idx) =>
            idx === currentTurn
              ? { ...pl, score: pl.score + earnedPts, activities: pl.activities + 1, quizCorrect: pl.quizCorrect + (isQuizRight ? 1 : 0) }
              : pl
          )

    function HealthyReminderView({ reminders, setReminders, onTriggerToast, onAwardXP }) {
      const [newPeriod, setNewPeriod] = useState("Pagi");
      const [newTime, setNewTime] = useState("09:00");
      const [newTitle, setNewTitle] = useState("");
      const [newDesc, setNewDesc] = useState("");
      const [filterPeriod, setFilterPeriod] = useState("Semua");
      const [lastAutoAlertKey, setLastAutoAlertKey] = useState("");
      const periods = ["Pagi", "Siang", "Sore", "Malam"];

      useEffect(() => {
        const checkDueReminders = () => {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, "0");
          const mm = String(now.getMinutes()).padStart(2, "0");
          const currentHHMM = `${hh}:${mm}`;
          const match = reminders.find((r) => r.active && !r.doneToday && r.time === currentHHMM);
          if (match) {
            const alertKey = `${match.id}-${currentHHMM}`;
            if (alertKey !== lastAutoAlertKey) {
              setLastAutoAlertKey(alertKey);
              onTriggerToast(
                `⏰ Waktunya Kebiasaan Sehat (${match.time})`,
                `Bakti mengingatkan: "${match.title}" — ${match.desc}`
              );
            }
          }
        };
        const timer = setInterval(checkDueReminders, 20000);
        return () => clearInterval(timer);
      }, [reminders, lastAutoAlertKey, onTriggerToast]);

      const toggleActive = (id) => setReminders((prev) => prev.map((r) => (r.id === id ? { ...r, active: !r.active } : r)));
      const toggleDoneToday = (rem) => {
        const becomingDone = !rem.doneToday;
        setReminders((prev) => prev.map((r) => (r.id === rem.id ? { ...r, doneToday: becomingDone } : r)));
        if (becomingDone) onAwardXP(15, `Kebiasaan Sehat: ${rem.title}`);
      };

      const deleteReminder = (id) => {
        setReminders((prev) => prev.filter((r) => r.id !== id));
        onTriggerToast("Pengingat Dihapus", "Jadwal pengingat telah dihapus dari daftar.");
      };

      const resetAllDoneToday = () => {
        setReminders((prev) => prev.map((r) => ({ ...r, doneToday: false })));
        onTriggerToast("Checklist Hari Baru Siap", "Status selesai hari ini telah direset untuk kebiasaan sehat berikutnya.");
      };

      const applyPreset = (preset) => {
        const item = {
          id: "rem-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
          period: preset.period,
          time: preset.time,
          title: preset.title,
          desc: preset.desc,
          active: true,
          doneToday: false
        };
        setReminders((prev) => [...prev, item]);
        onTriggerToast("Rekomendasi Ditambahkan!", `Pengingat "${item.title}" (${item.time}) aktif di jadwal ${item.period}.`);
      };

      const handleAddReminder = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const item = {
          id: "rem-" + Date.now(),
          period: newPeriod,
          time: newTime,
          title: newTitle.trim(),
          desc: newDesc.trim() || "Kebiasaan baik untuk menjaga kesehatan otak, jantung, dan pembuluh darah.",
          active: true,
          doneToday: false
        };
        setReminders((prev) => [...prev, item]);
        setNewTitle("");
        setNewDesc("");
        onTriggerToast("Pengingat Ditambahkan!", `Jadwal "${item.title}" pukul ${item.time} tersimpan.`);
      };

      const completedCount = reminders.filter((r) => r.doneToday).length;
      const activeCount = reminders.filter((r) => r.active).length;
      const visiblePeriods = filterPeriod === "Semua" ? periods : [filterPeriod];

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-[2rem] p-6 sm:p-8 shadow-lg relative overflow-hidden">
            <DecorativePatternBG opacity={0.12} />
            <div className="relative z-10 flex flex-wrap items-center justify-between gap-4">
              <div>
                <span className="bg-amber-300 text-slate-950 text-xs font-black px-3 py-1 rounded-full uppercase">Daily Habit &amp; Health Notification Tracker</span>
                <h1 className="text-2xl sm:text-4xl font-black mt-2">BAKTI SmartDoll: HealthyReminder</h1>
                <p className="text-purple-100 mt-1">Jadwal kebiasaan sehat terarah untuk menjaga otak, jantung, kontrol tensi/gula, dan pencegahan stroke.</p>
              </div>
              <div className="flex items-center gap-3">
                <div className="bg-white/15 backdrop-blur rounded-2xl p-3.5 border border-white/25 text-center">
                  <p className="text-xs font-bold uppercase text-amber-200">Aktif</p>
                  <p className="text-2xl font-black">{activeCount}</p>
                </div>
                <div className="bg-white/15 backdrop-blur rounded-2xl p-3.5 border border-white/25 text-center">
                  <p className="text-xs font-bold uppercase text-amber-200">Selesai Hari Ini</p>
                  <p className="text-2xl font-black">{completedCount} / {reminders.length}</p>
                </div>
              </div>
            </div>
          </div>

          <BaktianMascot
            mood="cheering"
            message="Pilih waktu pengingat yang sesuai dengan rutinitasmu! Setiap kebiasaan sehat yang kamu centang hari ini memberi +15 HP dan membantu menjaga kesehatan otak & jantung."
          />

          <div className="bg-white rounded-3xl p-4 border-2 border-purple-100 flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-xs font-extrabold text-slate-500 uppercase mr-1">Filter Waktu:</span>
              {["Semua", ...periods].map((p) => (
                <button
                  key={p}
                  type="button"
                  onClick={() => setFilterPeriod(p)}
                  className={`px-3.5 py-2 rounded-2xl text-xs font-black transition ${
                    filterPeriod === p ? "bg-purple-600 text-white shadow" : "bg-purple-50 text-purple-900 hover:bg-purple-100"
                  }`}
                >
                  {p}
                </button>
              ))}
            </div>

            <button
              type="button"
              onClick={resetAllDoneToday}
              className="px-3.5 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-black flex items-center gap-1.5 transition"
            >
              <Icon name="RotateCcw" className="w-3.5 h-3.5" />
              Reset Checklist Hari Ini
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {visiblePeriods.map((period) => {
              const list = reminders.filter((r) => r.period === period);
              return (
                <div key={period} className="bg-white rounded-[1.75rem] p-5 border-2 border-purple-100 shadow-sm space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                    <h3 className="text-xl font-black text-purple-900">
                      {period === "Pagi" ? "🌅" : period === "Siang" ? "☀️" : period === "Sore" ? "🌇" : "🌙"} Jadwal {period}
                    </h3>
                    <span className="text-xs font-bold text-slate-500">{list.length} Pengingat</span>
                  </div>
                  {list.length === 0 ? (
                    <p className="text-sm text-slate-400 italic py-4 text-center">Belum ada pengingat pada waktu {period}.</p>
                  ) : (
                    list.map((rem) => (
                      <div key={rem.id} className={`p-4 rounded-2xl border-2 transition ${rem.doneToday ? "bg-emerald-50/70 border-emerald-300" : "bg-slate-50 border-slate-200"}`}>
                        <div className="flex items-start justify-between gap-2">
                          <div className="flex items-start gap-3">
                            <button
                              type="button"
                              onClick={() => toggleDoneToday(rem)}
                              className={`mt-1 w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 ${rem.doneToday ? "bg-emerald-600 border-emerald-600 text-white" : "bg-white border-slate-300"}`}
                            >
                              {rem.doneToday && <Icon name="Check" className="w-4 h-4" />}
                            </button>
                            <div>
                              <p className={`font-black ${rem.doneToday ? "line-through text-slate-500" : "text-slate-900"}`}>{rem.title}</p>
                              <p className="text-xs text-slate-600 mt-0.5">{rem.desc}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            <input
                              type="time"
                              value={rem.time}
                              onChange={(e) => setReminders((prev) => prev.map((r) => (r.id === rem.id ? { ...r, time: e.target.value } : r)))}
                              className="px-2 py-1 rounded-xl border border-slate-300 bg-white text-xs font-black text-blue-700"
                            />
                            <button
                              type="button"
                              onClick={() => deleteReminder(rem.id)}
                              title="Hapus pengingat"
                              className="p-1.5 rounded-xl text-rose-500 hover:bg-rose-50 transition"
                            >
                              <Icon name="Trash2" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                        <div className="flex items-center justify-between mt-3 pt-2 border-t border-slate-200/70 text-xs">
                          <button
                            type="button"
                            onClick={() => onTriggerToast(`🔔 Pengingat ${rem.period} (${rem.time})`, `Bakti mengingatkan: "${rem.title}" — ${rem.desc}`)}
                            className="font-extrabold text-purple-700 hover:underline"
                          >
                            🔔 Tes Notifikasi Suara
                          </button>
                          <button
                            type="button"
                            onClick={() => toggleActive(rem.id)}
                            className={`px-2.5 py-1 rounded-full font-extrabold ${rem.active ? "bg-blue-600 text-white" : "bg-slate-200 text-slate-600"}`}
                          >
                            {rem.active ? "Aktif" : "Nonaktif"}
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              );
            })}
          </div>

          <div className="bg-purple-50/80 rounded-[2rem] p-6 border-2 border-purple-200 space-y-3">
            <h3 className="text-lg font-black text-purple-950">💡 Rekomendasi Pengingat Kesehatan Sesuai Kebutuhan</h3>
            <p className="text-xs text-slate-600 font-semibold">Klik salah satu rekomendasi di bawah untuk langsung menambahkannya ke jadwal harianmu:</p>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
              {RECOMMENDED_REMINDER_PRESETS.map((preset, idx) => (
                <div key={idx} className="bg-white p-4 rounded-2xl border border-purple-200 flex items-start justify-between gap-3">
                  <div>
                    <span className="text-[11px] font-black uppercase px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800">
                      {preset.period} • {preset.time}
                    </span>
                    <p className="font-black text-slate-900 text-sm mt-1.5">{preset.title}</p>
                    <p className="text-xs text-slate-600 mt-0.5">{preset.desc}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => applyPreset(preset)}
                    className="px-3 py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs font-black flex-shrink-0 transition"
                  >
                    + Pakai
                  </button>
                </div>
              ))}
            </div>
          </div>

          <form onSubmit={handleAddReminder} className="bg-white rounded-[2rem] p-6 border-2 border-blue-100 space-y-4">
            <h3 className="text-lg font-black text-slate-800">+ Tambah Pengingat Sehat Kustom</h3>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
              <select value={newPeriod} onChange={(e) => setNewPeriod(e.target.value)} className="p-3 rounded-2xl border border-slate-300 font-bold bg-slate-50">
                {periods.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
              <input type="time" value={newTime} onChange={(e) => setNewTime(e.target.value)} className="p-3 rounded-2xl border border-slate-300 font-bold bg-slate-50" />
              <input type="text" placeholder="Judul aktivitas sehat..." value={newTitle} onChange={(e) => setNewTitle(e.target.value)} className="sm:col-span-2 p-3 rounded-2xl border border-slate-300 font-semibold" />
            </div>
            <div className="flex flex-col sm:flex-row gap-3">
              <input type="text" placeholder="Catatan manfaat kesehatan (opsional)" value={newDesc} onChange={(e) => setNewDesc(e.target.value)} className="flex-1 p-3 rounded-2xl border border-slate-300 font-semibold" />
              <button type="submit" className="px-6 py-3 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-black shadow">Simpan Pengingat</button>
            </div>
          </form>
        </div>
      );
    }

    function ProfileLeaderboardView({
      activeEmail,
      userStats,
      globalLeaderboard,
      onRefreshLeaderboard,
      onUpdateName,
      onLogout,
      levelInfo,
      reminders
    }) {
      const [editingName, setEditingName] = useState(false);
      const [nameInput, setNameInput] = useState(userStats.name);

      const displayLeaderboard = useMemo(() => {
        const cleanEmail = (activeEmail || "").trim().toLowerCase();
        const myEmailKey = cleanEmail.replace(/[^a-z0-9]/g, "_");
        const myRow = {
          emailKey: myEmailKey,
          name: userStats.name,
          email: cleanEmail,
          xp: userStats.xp,
          streak: userStats.streak,
          gamesPlayed: userStats.gamesPlayed || 0,
          badgesCount: (userStats.badges || []).length,
          level: levelInfo.name,
          latestActivity: userStats.history?.[0]?.title || "Aktif belajar sehat"
        };

        const others = (globalLeaderboard || []).filter(
          (item) =>
            item.emailKey !== myEmailKey &&
            (item.email || "").trim().toLowerCase() !== cleanEmail
        );
        return [myRow, ...others].sort((a, b) => (b.xp || 0) - (a.xp || 0));
      }, [activeEmail, userStats, globalLeaderboard, levelInfo.name]);

      const allLevels = [
        { name: "Health Beginner", min: 0 },
        { name: "Brain Explorer", min: 200 },
        { name: "Heart Guardian", min: 500 },
        { name: "Lab Detective", min: 800 },
        { name: "Health Champion", min: 1200 }
      ];

      const dayLabels = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 bg-white rounded-[2rem] p-6 border-2 border-blue-100 shadow-sm space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-3xl bg-gradient-to-br from-blue-600 to-rose-500 text-white flex items-center justify-center text-3xl shadow-md">
                    🐒
                  </div>
                  <div>
                    {editingName ? (
                      <div className="flex items-center gap-2">
                        <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="px-3 py-1 rounded-xl border-2 border-blue-400 font-black" />
                        <button
                          type="button"
                          onClick={() => {
                            if (nameInput.trim()) onUpdateName(nameInput.trim());
                            setEditingName(false);
                          }}
                          className="px-3 py-1 rounded-xl bg-blue-600 text-white text-xs font-black"
                        >
                          Simpan
                        </button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        <h1 className="text-2xl font-black text-slate-900">{userStats.name}</h1>
                        <button type="button" onClick={() => { setNameInput(userStats.name); setEditingName(true); }} className="text-slate-400 hover:text-blue-600" title="Ubah Nama di Peringkat">
                          <Icon name="Edit3" className="w-4 h-4" />
                        </button>
                      </div>
                    )}
                    <div className="flex flex-wrap items-center gap-2 mt-1">
                      <span className="px-3 py-0.5 rounded-full bg-amber-100 text-amber-900 text-xs font-black">
                        🏅 {levelInfo.name} • {userStats.xp} HP
                      </span>
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-800">
                        ✉️ {activeEmail}
                      </span>
                    </div>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={onLogout}
                  className="px-4 py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-black flex items-center gap-1.5"
                >
                  <Icon name="LogOut" className="w-4 h-4" />
                  Keluar Akun
                </button>
              </div>

              <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <p className="text-xs font-extrabold text-slate-500 uppercase mb-2">Tingkatan Level Pengguna:</p>
                <div className="flex flex-wrap gap-1.5">
                  {allLevels.map((lvl) => {
                    const unlocked = userStats.xp >= lvl.min;
                    return (
                      <span
                        key={lvl.name}
                        className={`px-3 py-1.5 rounded-xl text-xs font-black ${
                          lvl.name === levelInfo.name ? "bg-blue-600 text-white shadow" : unlocked ? "bg-emerald-100 text-emerald-800" : "bg-slate-200 text-slate-500"
                        }`}
                      >
                        {lvl.name} ({lvl.min}+)
                      </span>
                    );
                  })}
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div className="p-3 rounded-2xl bg-blue-50 text-center"><p className="text-xs font-bold text-blue-700">Game Selesai</p><p className="text-2xl font-black text-blue-900">{userStats.gamesPlayed}</p></div>
                <div className="p-3 rounded-2xl bg-rose-50 text-center"><p className="text-xs font-bold text-rose-700">Artikel Dibaca</p><p className="text-2xl font-black text-rose-900">{(userStats.readArticles || []).length}</p></div>
                <div className="p-3 rounded-2xl bg-amber-50 text-center"><p className="text-xs font-bold text-amber-700">Badge Diraih</p><p className="text-2xl font-black text-amber-900">{(userStats.badges || []).length}</p></div>
                <div className="p-3 rounded-2xl bg-purple-50 text-center"><p className="text-xs font-bold text-purple-700">Pengingat Aktif</p><p className="text-2xl font-black text-purple-900">{reminders.filter((r) => r.active).length}</p></div>
              </div>

              <div>
                <h3 className="font-black text-slate-800 mb-2">Koleksi Badge Pencapaian:</h3>
                <div className="flex flex-wrap gap-2">
                  {["Brain Explorer", "Brain Master", "Healthy Hero", "Stroke Awareness Champion", "Lab Detective"].map((b) => {
                    const earned = (userStats.badges || []).includes(b);
                    return (
                      <div
                        key={b}
                        className={`px-3.5 py-2 rounded-2xl border-2 text-xs font-black flex items-center gap-1.5 ${
                          earned ? "bg-amber-50 border-amber-400 text-amber-950" : "bg-slate-50 border-slate-200 text-slate-400"
                        }`}
                      >
                        <Icon name="Award" className={`w-4 h-4 ${earned ? "text-amber-500" : "text-slate-300"}`} />
                        {b}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="lg:col-span-5 bg-gradient-to-br from-orange-500 via-amber-500 to-rose-500 text-white rounded-[2rem] p-6 shadow-lg flex flex-col justify-between">
              <div className="text-center">
                <div className="w-20 h-20 rounded-full bg-white/20 backdrop-blur mx-auto flex items-center justify-center mb-2">
                  <Icon name="Flame" className="w-12 h-12 text-amber-200 fill-amber-200 animate-pulse" />
                </div>
                <p className="text-4xl font-black">{userStats.streak} Hari Streak!</p>
                <p className="text-amber-100 text-sm mt-1">Pertahankan semangat belajar sehatmu setiap hari!</p>
              </div>

              <div className="bg-white/95 text-slate-800 rounded-3xl p-4 mt-5">
                <p className="text-xs font-black uppercase text-slate-500 mb-3 text-center">Catatan Konsistensi Mingguan</p>
                <div className="grid grid-cols-7 gap-1.5 text-center">
                  {dayLabels.map((day, idx) => {
                    const active = (userStats.weekDays || [])[idx];
                    return (
                      <div key={day} className="flex flex-col items-center">
                        <span className="text-[11px] font-bold text-slate-500 mb-1">{day}</span>
                        <div className={`w-9 h-9 rounded-full flex items-center justify-center font-black text-xs ${active ? "bg-orange-500 text-white shadow" : "bg-slate-100 text-slate-400"}`}>
                          {active ? "🔥" : idx + 1}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 bg-white rounded-[2rem] p-6 border-2 border-amber-200 shadow-sm space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-2xl font-black text-slate-900 flex items-center gap-2">
                    <Icon name="Trophy" className="w-6 h-6 text-amber-500" />
                    Papan Peringkat Global ({displayLeaderboard.length} Pemain)
                  </h2>
                  <p className="text-xs text-slate-500 font-semibold mt-0.5">
                    Peringkat otomatis tersusun dari Health Points (HP) tertinggi ke terendah
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  {onRefreshLeaderboard && (
                    <button
                      type="button"
                      onClick={onRefreshLeaderboard}
                      className="px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-black flex items-center gap-1 transition"
                      title="Sinkronkan Peringkat Sekarang"
                    >
                      <Icon name="RotateCcw" className="w-3.5 h-3.5" />
                      Perbarui
                    </button>
                  )}
                  <span className="text-xs font-extrabold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                    ● Live Cloud
                  </span>
                </div>
              </div>

              <div className="space-y-2.5">
                {displayLeaderboard.map((row, idx) => {
                  const isMe =
                    (row.email && row.email.toLowerCase() === activeEmail) ||
                    row.emailKey === activeEmail.replace(/[^a-z0-9]/g, "_");
                  const maskedEmail = row.email
                    ? row.email.replace(
                        /^(.{2})(.*)(@.*)$/,
                        (_, a, b, c) => `${a}${"*".repeat(Math.min(4, Math.max(1, b.length)))}${c}`
                      )
                    : "";
                  return (
                    <div
                      key={row.emailKey || row.uid || idx}
                      className={`p-3.5 rounded-2xl border-2 flex items-center justify-between gap-3 transition ${
                        isMe
                          ? "bg-blue-50 border-blue-500 shadow-sm"
                          : idx === 0
                          ? "bg-amber-50 border-amber-300"
                          : "bg-slate-50 border-slate-100"
                      }`}
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <span
                          className={`w-9 h-9 rounded-xl font-black flex items-center justify-center text-sm flex-shrink-0 ${
                            idx === 0
                              ? "bg-amber-400 text-slate-950"
                              : idx === 1
                              ? "bg-slate-300 text-slate-900"
                              : idx === 2
                              ? "bg-orange-300 text-slate-950"
                              : "bg-white text-slate-600 border border-slate-200"
                          }`}
                        >
                          #{idx + 1}
                        </span>
                        <span className="text-2xl flex-shrink-0">{idx === 0 ? "👑" : "🐒"}</span>
                        <div className="min-w-0">
                          <p className="font-black text-slate-900 truncate">
                            {row.name}{" "}
                            {isMe && (
                              <span className="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full ml-1">
                                Anda
                              </span>
                            )}
                          </p>
                          <p className="text-xs font-bold text-slate-500">
                            {row.level} • 🔥 {row.streak || 1}d • 🎮 {row.gamesPlayed || 0} Game • 🏅{" "}
                            {row.badgesCount || 1} Badge {maskedEmail ? `• ✉️ ${maskedEmail}` : ""}
                          </p>
                          {row.latestActivity && (
                            <p className="text-[11px] font-semibold text-blue-700 mt-0.5 truncate">
                              ✨ Aktivitas terakhir: {row.latestActivity}
                            </p>
                          )}
                        </div>
                      </div>
                      <span className="font-black text-blue-700 bg-white px-3 py-1.5 rounded-xl border border-blue-100 flex-shrink-0">
                        {row.xp} HP
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="lg:col-span-5 bg-white rounded-[2rem] p-6 border-2 border-slate-100 shadow-sm space-y-4">
              <h2 className="text-xl font-black text-slate-900">Riwayat Aktivitas Terakhir</h2>
              <div className="space-y-2.5">
                {(userStats.history || []).map((h, i) => (
                  <div key={i} className="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
                    <div>
                      <p className="font-bold text-slate-800 text-sm">{h.title}</p>
                      <p className="text-[11px] text-slate-500">{h.date}</p>
                    </div>
                    <span className="text-xs font-black text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full">
                      +{h.points} HP
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AdminDashboardView({
      labCases, setLabCases,
      quizQuestions, setQuizQuestions,
